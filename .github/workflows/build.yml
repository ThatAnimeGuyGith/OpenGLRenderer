name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }} (${{ matrix.build_type }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu
            os: ubuntu-latest
            build_type: debug
          - name: Ubuntu
            os: ubuntu-latest
            build_type: release
          - name: macOS
            os: macos-latest
            build_type: debug
          - name: macOS
            os: macos-latest
            build_type: release
          - name: Windows
            os: windows-latest
            build_type: debug
          - name: Windows
            os: windows-latest
            build_type: release

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Cache FetchContent dependencies
        uses: actions/cache@v5
        with:
          path: build/${{ matrix.build_type }}/_deps
          key: fetchcontent-${{ runner.os }}-${{ matrix.build_type }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libwayland-dev libxkbcommon-dev wayland-protocols \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev

      - name: Set up MSYS2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            git
        env:
          CACHE_KEY: msys2-${{ matrix.build_type }}

      - name: Configure build on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: cmake --preset ${{ matrix.build_type }} -DFETCHCONTENT_UPDATES_DISCONNECTED=ON

      - name: Configure build on Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: cmake --preset ${{ matrix.build_type }} -DFETCHCONTENT_UPDATES_DISCONNECTED=ON

      - name: Build target on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: cmake --build --preset ${{ matrix.build_type }}

      - name: Build target on Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: cmake --build --preset ${{ matrix.build_type }}

      - name: Run tests on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: ctest --test-dir build/${{ matrix.build_type }} --output-on-failure -C ${{ matrix.build_type }}

      - name: Run tests on Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: ctest --test-dir build/${{ matrix.build_type }} --output-on-failure -C ${{ matrix.build_type }}

      - name: Package Release on Unix
        if: matrix.build_type == 'release' && runner.os != 'Windows'
        shell: bash
        run: cmake --build --preset release --target package_release

      - name: Package Release on Windows
        if: matrix.build_type == 'release' && runner.os == 'Windows'
        shell: msys2 {0}
        run: cmake --build --preset release --target package_release

      - name: Record release package path on Unix
        if: matrix.build_type == 'release' && runner.os != 'Windows'
        id: package_path_unix
        shell: bash
        run: |
          package_path=$(cat build/release/release-package-path.txt)
          test -f "$package_path"
          echo "path=$package_path" >> "$GITHUB_OUTPUT"

      - name: Record release package path on Windows
        if: matrix.build_type == 'release' && runner.os == 'Windows'
        id: package_path_windows
        shell: pwsh
        run: |
          $packagePath = (Get-Content build/release/release-package-path.txt -Raw).Trim()
          if (-not (Test-Path -LiteralPath $packagePath -PathType Leaf)) {
            throw "Release package was not created: $packagePath"
          }
          "path=$packagePath" >> $env:GITHUB_OUTPUT

      - name: Upload Release build output
        if: >-
          matrix.build_type == 'release' &&
          (github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'push' && github.ref == 'refs/heads/main'))
        uses: actions/upload-artifact@v7
        with:
          name: OpenGLRenderer-${{ matrix.name }}-Release
          path: |
            build/release/OpenGLRenderer*
            build/release/assets
          if-no-files-found: error
          retention-days: 7

      - name: Upload Release package
        if: >-
          matrix.build_type == 'release' &&
          (github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'push' && github.ref == 'refs/heads/main'))
        uses: actions/upload-artifact@v7
        with:
          name: OpenGLRenderer-${{ matrix.name }}-Release-Package
          path: ${{ steps.package_path_unix.outputs.path || steps.package_path_windows.outputs.path }}
          if-no-files-found: error
          retention-days: 7
